name: Build and deploy TaskHub Web

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'web/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/web-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install packages
        run: flutter pub get

      - name: Build current web app
        run: flutter build web --release --base-href "/TaskHub/"

      - name: Version web entrypoints
        shell: python
        run: |
          import json, os
          from pathlib import Path
          root = Path('build/web')
          revision = os.environ['GITHUB_SHA']
          entry = f'main.{revision[:12]}.dart.js'
          bootstrap = f'flutter_bootstrap.{revision[:12]}.js'
          script = root / 'flutter_bootstrap.js'
          content = script.read_text()
          if 'main.dart.js' not in content:
              raise SystemExit('Expected Flutter JavaScript entrypoint missing')
          (root / 'main.dart.js').rename(root / entry)
          script.write_text(content.replace('main.dart.js', entry))
          script.rename(root / bootstrap)
          index = root / 'index.html'
          index.write_text(index.read_text().replace('flutter_bootstrap.js', bootstrap))
          (root / 'build-info.json').write_text(json.dumps({'commit': revision, 'run': os.environ['GITHUB_RUN_ID']}))
          (root / '.nojekyll').touch()

      - name: Upload web build
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
