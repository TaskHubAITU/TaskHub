name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Check source
        run: |
          flutter analyze
          flutter test

      - name: Build installable APK
        run: flutter build apk --release --build-number=$((10000 + GITHUB_RUN_NUMBER))

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: taskhub-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
