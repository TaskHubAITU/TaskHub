services:
  api:
    build: .
    restart: unless-stopped
    environment:
      TASKHUB_TRUST_PROXY: '1'
    volumes:
      - taskhub_data:/data
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    pids_limit: 100
  backup:
    build: .
    restart: unless-stopped
    command: [python, -m, backend.maintenance]
    environment:
      TASKHUB_DB: /data/taskhub.sqlite3
    volumes:
      - taskhub_data:/data:ro
      - taskhub_backups:/backups
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python, -c, "import time,pathlib; assert time.time()-int(pathlib.Path('/backups/last-success').read_text()) < 90000"]
      interval: 60s
      start_period: 300s
    depends_on:
      api:
        condition: service_healthy
  web:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ['80:80', '443:443']
    environment:
      TASKHUB_DOMAIN: ${TASKHUB_DOMAIN:?Set TASKHUB_DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./build/web:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
volumes:
  taskhub_data:
  taskhub_backups:
  caddy_data:
  caddy_config:
